# gsd-pi-ci: remote `pr`-tier verification harness for pimmink/gsd-pi.
#
# Phase-1 MVP. Manually dispatched only (no push/pull_request triggers, ever).
# Checks out one exact, already-pushed commit of pimmink/gsd-pi and runs the same
# scope as that repo's local `verify:pr` (build:core + typecheck:extensions +
# test:unit + lifecycle-shadow gate), plus the native test-engine build/staging step
# that pimmink/gsd-pi's scripts/verify-merge.sh currently omits (see
# open-gsd/gsd-pi#1582 for the underlying native-engine-staging gap this mirrors).
#
# Explicitly out of scope for this MVP: a remote `targeted` tier (targeted tests and
# typecheck stay local), a `merge`-parity tier (upstream CI also runs
# windows-portability/node22-smoke/docker-e2e jobs this harness does not reproduce
# yet), sharding, Codespaces, and any Copilot cloud agent usage. See
# docs/phase-2-deferral.md for why and what would need to change first.
name: Remote PR verification (gsd-pi)

run-name: "${{ inputs.owned_runtime_only && 'Owned runtime' || 'Stable verify' }}: ${{ inputs.source_ref }} @ ${{ inputs.expected_sha }} (run #${{ github.run_number }})"

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch in pimmink/gsd-pi to verify (e.g. fix/my-branch)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character SHA (ordinary verification requires branch equality; artifact-only fetches this exact SHA)'
        required: true
        type: string
      owned_runtime_only:
        description: 'Artifact-only darwin/x64 core runtime; skips ordinary PR verification, not a release/merge gate'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_REPO: pimmink/gsd-pi

concurrency:
  # Artifact runs are unique and cannot cancel ordinary verification or another artifact run.
  group: ${{ inputs.owned_runtime_only && format('gsd-pi-owned-runtime-{0}-{1}', github.run_id, github.run_attempt) || format('gsd-pi-remote-pr-verification-{0}', inputs.source_ref) }}
  cancel-in-progress: ${{ !inputs.owned_runtime_only }}

jobs:
  pr-verify:
    if: ${{ !inputs.owned_runtime_only }}
    name: pr-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Explicit shell: bash (here and per-step) runs as `bash --noprofile --norc -eo pipefail`,
    # so any `... | tee ...` pipeline below fails closed on the real command's exit code,
    # not tee's. Without this, GitHub's implicit default shell omits `pipefail`.
    defaults:
      run:
        shell: bash
    steps:
      # Cheapest possible fail-fast: a ls-remote is a ref->sha lookup with no object
      # transfer at all, so a stale/mismatched ref/sha pair never touches a single
      # repository object, let alone runs install/build.
      - name: Verify source_ref resolves to expected_sha (before touching any objects)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          # Hardcoded, not derived from any input; the only repository this harness ever contacts.
          repo_url="https://github.com/pimmink/gsd-pi.git"

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be exactly 40 lowercase hexadecimal characters, got: $EXPECTED_SHA"
            exit 1
          fi

          if [[ -z "$SOURCE_REF" || "$SOURCE_REF" == -* || "$SOURCE_REF" == refs/* ]]; then
            echo "::error::source_ref must be a plain branch name, not an option or full ref"
            exit 1
          fi

          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null; then
            echo "::error::source_ref is not a valid Git branch name"
            exit 1
          fi

          # We construct the ref ourselves; source_ref is only ever used as the leaf
          # branch name, never as a caller-supplied ref path.
          target_ref="refs/heads/${SOURCE_REF}"

          remote_matches="$(git ls-remote "$repo_url" "$target_ref")"
          match_count="$(printf '%s\n' "$remote_matches" | grep -c .)" || match_count=0
          if [[ "$match_count" -ne 1 ]]; then
            echo "::error::Expected exactly one match for ${target_ref} on ${repo_url}, found ${match_count}."
            exit 1
          fi
          remote_sha="$(printf '%s\n' "$remote_matches" | cut -f1)"

          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::${target_ref} on ${repo_url} currently points at ${remote_sha}, not the expected ${EXPECTED_SHA}. Stopping before checkout."
            exit 1
          fi
          echo "Pre-checkout check passed: ${target_ref} == ${EXPECTED_SHA}"

      # Mirrors upstream ci.yml's own "Checkout repository without GITHUB_TOKEN" step
      # (same git init/remote add/fetch/checkout --force --detach shape), retargeted at
      # a specific commit SHA in a different public repo instead of GITHUB_SHA in the
      # same repo. No actions/checkout, no token, nothing to persist: this exceeds a
      # bare `persist-credentials: false` by never invoking a credential at all.
      - name: Checkout exact commit without a token (public repo, read-only)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          repo_url="https://github.com/pimmink/gsd-pi.git"
          target_ref="refs/heads/${SOURCE_REF}"

          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin \
            "+${target_ref}:refs/checkout-ref"
          git checkout --force --detach refs/checkout-ref

      # Defense in depth: the checkout above fetches by branch ref, not by SHA, so
      # this is the step that actually fails the job closed if the branch moved
      # between the pre-checkout ls-remote and this fetch.
      - name: Assert HEAD matches expected_sha (fail closed)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::HEAD is ${head_sha}, expected ${EXPECTED_SHA}. Stopping."
            exit 1
          fi
          echo "HEAD verified: ${head_sha}"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (pinned, reused from gsd-pi's ci.yml)
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Same env flags gsd-pi's own ci.yml build job uses for this exact install.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain (native addon for tests)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned, reused from gsd-pi's ci.yml)

      - name: Cache Rust build (native addon)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (pinned, reused from gsd-pi's ci.yml)
        with:
          # Own namespace: must never collide with gsd-pi ci.yml's own "native-linux-x64-gnu" key.
          shared-key: gsd-pi-ci-remote-pr-native-linux-x64-gnu
          workspaces: native -> target

      - name: Build native addon from source (test parity, dev + fault-injection profile)
        env:
          # Portable baseline for the shared runner fleet, same override gsd-pi's
          # ci.yml build job applies for the same reason (native/.cargo/config.toml
          # bakes host-specific CPU instructions into dev builds otherwise).
          RUSTFLAGS: '-C target-cpu=x86-64'
        run: pnpm run build:native:test

      - name: Build core
        run: pnpm run build:core

      - name: Typecheck extensions
        run: pnpm run typecheck:extensions

      - name: Compile test artifacts
        run: pnpm run test:compile

      # The exact staging step scripts/verify-merge.sh omits (root cause of
      # open-gsd/gsd-pi#1582's ~140 local failures on a fresh checkout). Runs after
      # test:compile, matching the compiled-test loader's expected layout.
      - name: Mirror native addon into dist-test (compiled-test loader path)
        run: |
          mkdir -p dist-test/native/addon
          shopt -s nullglob
          addons=(native/addon/*.node)
          if [[ ${#addons[@]} -eq 0 ]]; then
            echo "::error::No compiled .node addon found under native/addon/ - native build did not produce an addon."
            exit 1
          fi
          cp "${addons[@]}" dist-test/native/addon/
          ls -la dist-test/native/addon/

      # No GSD_HOME override: the GitHub-hosted runner's own $HOME is already a fresh,
      # per-run-isolated temp filesystem, so production code that reads $HOME (e.g. the
      # doctor-providers auth.json lookup, app-paths, RTK env setup) sees the same real
      # default path shape the tests themselves expect, instead of a second, divergent
      # temp root nothing but this harness ever pointed GSD_HOME at.
      - name: Run unit tests
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run test:unit:compiled 2>&1 | tee "${RUNNER_TEMP}/test-unit-compiled.log"

      - name: Run lifecycle shadow gate
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run gate:lifecycle-shadow-no-cutover 2>&1 | tee "${RUNNER_TEMP}/lifecycle-shadow-gate.log"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          actual_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo unknown)"
          {
            echo "### Remote pr-verification summary"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| repo | ${SOURCE_REPO} |"
            echo "| source_ref | ${SOURCE_REF} |"
            echo "| expected_sha | ${EXPECTED_SHA} |"
            echo "| actual checked-out SHA | ${actual_sha} |"
            echo "| workflow version/ref | ${WORKFLOW_REF} (gsd-pi-ci) |"
            echo "| result | ${JOB_STATUS} |"
            echo "| run URL | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gsd-pi-remote-pr-verification-diagnostics
          path: |
            ${{ runner.temp }}/test-unit-compiled.log
            ${{ runner.temp }}/lifecycle-shadow-gate.log
          if-no-files-found: ignore
          retention-days: 3

  owned-runtime:
    if: ${{ inputs.owned_runtime_only }}
    name: owned-runtime (artifact only, not PR verification)
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_REF: ${{ inputs.source_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_REPOSITORY: ${{ github.repository }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GSD_SKIP_RTK_INSTALL: '1'
      GSD_SKIP_DEP_REPAIR: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      # Empty encoded flags override native/.cargo/config.toml's target-cpu=native.
      # Rust's x86_64-apple-darwin target baseline is portable; do not inherit host tuning.
      CARGO_ENCODED_RUSTFLAGS: ''
      RUSTFLAGS: ''
    steps:
      - name: Validate pins, observe branch head, checkout exact source and workflow helpers
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_REPOSITORY" == pimmink/gsd-pi-ci ]]
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" != -* && "$SOURCE_REF" != refs/* ]]
          git check-ref-format --branch "$SOURCE_REF" >/dev/null
          observed="$(git ls-remote https://github.com/pimmink/gsd-pi.git "refs/heads/${SOURCE_REF}")"
          [[ "$(printf '%s\n' "$observed" | grep -c .)" == 1 ]]
          observed_sha="$(printf '%s\n' "$observed" | cut -f1)"
          [[ "$observed_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "OBSERVED_BRANCH_HEAD=$observed_sha"
            echo "OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          # No credentials, branch equality, or workflow-SHA/source-SHA aliasing here.
          git init source
          git -C source remote add origin https://github.com/pimmink/gsd-pi.git
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git -C source rev-parse --abbrev-ref HEAD)" == HEAD ]]
          git init ci-helpers
          git -C ci-helpers remote add origin https://github.com/pimmink/gsd-pi-ci.git
          git -C ci-helpers fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git -C ci-helpers checkout --detach FETCH_HEAD
          [[ "$(git -C ci-helpers rev-parse HEAD)" == "$WORKFLOW_SHA" ]]

      - name: Setup pnpm (existing pin)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1
          package_json_file: source/package.json
          run_install: false

      - name: Setup Node (existing action pin, explicit runtime version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'

      - name: Assert native host and run offline helper/security tests
        run: |
          node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') throw Error('requires darwin/x64')"
          python3 -m unittest discover -s ../ci-helpers/scripts/tests -v

      - name: Frozen dependencies and core build only (online runner)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:core

      - name: Setup Rust (existing pin; resolved stable version recorded)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Build source-native portable release addon
        working-directory: source/native/crates/engine
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p ../../addon
          cp ../../target/x86_64-apple-darwin/release/libgsd_engine.dylib ../../addon/gsd_engine.darwin-x64.node
          file ../../addon/gsd_engine.darwin-x64.node
          # Resolve loader dependencies against system libraries, not runner-only dylibs.
          otool -L ../../addon/gsd_engine.darwin-x64.node > "$RUNNER_TEMP/owned-native-libraries.txt"
          otool -D ../../addon/gsd_engine.darwin-x64.node > "$RUNNER_TEMP/owned-native-id.txt"

      - name: Record build context and package bounded full dependency closure
        run: |
          [[ "$(git -C ../ci-helpers rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          git -C ../ci-helpers diff --quiet HEAD --
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def version(*args):
              return subprocess.check_output(args, text=True, timeout=30).strip()
          context = {
              'expected_sha': os.environ['EXPECTED_SHA'], 'source_ref': os.environ['SOURCE_REF'],
              'observed_branch_head': os.environ['OBSERVED_BRANCH_HEAD'], 'observed_at': os.environ['OBSERVED_AT'],
              'workflow_sha': os.environ['WORKFLOW_SHA'], 'workflow_ref': os.environ['WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'build': {'started_at': os.environ['BUILD_STARTED_AT'], 'node': version('node', '--version'),
                        'pnpm': version('pnpm', '--version'), 'rust': version('rustc', '-Vv'),
                        'cargo': version('cargo', '--version'), 'python': version('python3', '--version'),
                        'os': version('sw_vers'), 'kernel_arch': version('uname', '-m'),
                        'runner_image': os.environ.get('ImageOS'), 'runner_image_version': os.environ.get('ImageVersion'),
                        'deployment_target': os.environ['MACOSX_DEPLOYMENT_TARGET'],
                        'cargo_encoded_rustflags': os.environ['CARGO_ENCODED_RUSTFLAGS'], 'rustflags': os.environ['RUSTFLAGS'],
                        'target': 'x86_64-apple-darwin', 'profile': 'release --locked',
                        'native_libraries': Path(os.environ['RUNNER_TEMP'], 'owned-native-libraries.txt').read_text(),
                        'native_library_id': Path(os.environ['RUNNER_TEMP'], 'owned-native-id.txt').read_text()}}
          Path(os.environ['RUNNER_TEMP'], 'owned-context.json').write_text(json.dumps(context))
          PY
          python3 ../ci-helpers/scripts/package-owned-runtime.py --source "$PWD" \
            --output "$RUNNER_TEMP/owned-bundle" --context "$RUNNER_TEMP/owned-context.json"

      - name: Verify, safely unpack and prove source-native/internal imports (no CLI host)
        run: |
          python3 ../ci-helpers/scripts/verify-owned-runtime.py --bundle "$RUNNER_TEMP/owned-bundle" \
            --expected-sha "$EXPECTED_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --destination "$RUNNER_TEMP/owned-verified" --probe-node "$(command -v node)" \
            > "$RUNNER_TEMP/owned-bundle/verification.json"

      - name: Upload owned core runtime (not a release)
        id: artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (existing pin)
        with:
          name: owned-runtime-${{ inputs.expected_sha }}-darwin-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-bundle/runtime.tar.gz
            ${{ runner.temp }}/owned-bundle/SHA256SUMS
            ${{ runner.temp }}/owned-bundle/file-manifest.json
            ${{ runner.temp }}/owned-bundle/provenance.json
            ${{ runner.temp }}/owned-bundle/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize separate source/workflow pins and artifact identities
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          {
            echo '### Owned core runtime (artifact-only, not PR/merge/release acceptance)'
            echo "Source: pimmink/gsd-pi @ $EXPECTED_SHA"
            echo "Observed branch: $SOURCE_REF @ $OBSERVED_BRANCH_HEAD ($OBSERVED_AT)"
            echo "Workflow/helpers: $WORKFLOW_REF @ $WORKFLOW_SHA"
            echo "Run/attempt: $GITHUB_RUN_ID / $GITHUB_RUN_ATTEMPT"
            echo "Actions artifact ID: $ARTIFACT_ID; outer digest: $ARTIFACT_DIGEST"
            echo 'Inner payload checksums:'
            echo '```text'
            sed -n '1,3p' "$RUNNER_TEMP/owned-bundle/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
