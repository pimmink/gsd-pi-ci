# gsd-pi-ci: GENERALIZED sharded remote `pr`-tier verification for pimmink/gsd-pi.
#
# Originally an experiment to measure whether splitting `test:unit:compiled` across N
# parallel shards meaningfully reduces wall-clock time (see docs/phase-2-deferral.md
# for that history: run 32016308055 proved it, ~37% reduction). That experiment used a
# hand-copied list of 13 test globs and hardcoded expected file/pass/fail/skip counts
# from one specific commit. Those hardcoded values made the workflow silently unusable
# against ANY other commit/branch with a different test count (discovered against the
# `feat/github-copilot-model-catalog-sync` branch, which legitimately has more tests
# than the calibration commit - see run 32024561928 and docs/phase-2-deferral.md).
#
# This revision removes that dependency structurally: the canonical set of compiled
# test files is derived at run time from the actual checked-out commit's own
# `package.json` `test:unit:compiled` script (never a copied glob list), expanded into
# a manifest by directly reading the compiled `dist-test/` output (not shell globbing,
# which previously produced multiple different, mutually disagreeing counts for the
# same tree - see the "why not shell globbing" note on the expand step below), and
# partitioned into shard_count deterministic, non-overlapping chunks in the build job.
# Each shard job runs exactly its own precomputed chunk (no reliance on Node's own
# `--test-shard` glob-resolution semantics, which cannot be proven to receive an
# identical file list across shard processes as easily as a shared, checksummed
# manifest artifact can). Pass/skipped totals are summed and reported dynamically,
# never compared against a hardcoded historical baseline; `failed` is asserted to be
# exactly zero. Coverage (every canonical file assigned to exactly one shard, no gaps,
# no duplicates) is proven structurally by reassembling the shard partitions and
# diffing them against the canonical manifest, not by matching a magic number.
#
# This is a SEPARATE file from remote-pr-verification.yml on purpose: the stable
# harness is never modified by this workflow, and this workflow's concurrency group is
# namespaced independently so a sharded dispatch can never cancel a legitimate
# stable-harness run (or vice versa). remote-pr-verification.yml remains available as
# a trusted, simpler fallback (see docs/remote-verification-guide.md).
#
# Not merge-parity: Windows-, Node 22-, and conditional Docker-e2e checks remain out of
# scope, same as remote-pr-verification.yml. See docs/phase-2-deferral.md.
name: Remote PR verification (gsd-pi) - sharded

run-name: "Sharded verify: ${{ inputs.source_ref }} @ ${{ inputs.expected_sha }} (run #${{ github.run_number }})"

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch in pimmink/gsd-pi to verify (e.g. fix/my-branch)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character commit SHA that source_ref must resolve to'
        required: true
        type: string
      shard_count:
        description: 'Number of parallel test:unit:compiled shards'
        required: false
        type: string
        default: '4'

permissions:
  contents: read

env:
  SOURCE_REPO: pimmink/gsd-pi

concurrency:
  group: gsd-pi-remote-pr-verification-sharded-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (once)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      shard_matrix: ${{ steps.matrix.outputs.shard_matrix }}
      manifest_total: ${{ steps.expand.outputs.total }}
    steps:
      - name: Verify source_ref resolves to expected_sha (before touching any objects)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          repo_url="https://github.com/pimmink/gsd-pi.git"

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be exactly 40 lowercase hexadecimal characters, got: $EXPECTED_SHA"
            exit 1
          fi

          if [[ -z "$SOURCE_REF" || "$SOURCE_REF" == -* || "$SOURCE_REF" == refs/* ]]; then
            echo "::error::source_ref must be a plain branch name, not an option or full ref"
            exit 1
          fi

          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null; then
            echo "::error::source_ref is not a valid Git branch name"
            exit 1
          fi

          target_ref="refs/heads/${SOURCE_REF}"

          remote_matches="$(git ls-remote "$repo_url" "$target_ref")"
          match_count="$(printf '%s\n' "$remote_matches" | grep -c .)" || match_count=0
          if [[ "$match_count" -ne 1 ]]; then
            echo "::error::Expected exactly one match for ${target_ref} on ${repo_url}, found ${match_count}."
            exit 1
          fi
          remote_sha="$(printf '%s\n' "$remote_matches" | cut -f1)"

          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::${target_ref} on ${repo_url} currently points at ${remote_sha}, not the expected ${EXPECTED_SHA}. Stopping before checkout."
            exit 1
          fi
          echo "Pre-checkout check passed: ${target_ref} == ${EXPECTED_SHA}"

      - name: Checkout exact commit without a token (public repo, read-only)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          repo_url="https://github.com/pimmink/gsd-pi.git"
          target_ref="refs/heads/${SOURCE_REF}"

          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin \
            "+${target_ref}:refs/checkout-ref"
          git checkout --force --detach refs/checkout-ref

      - name: Assert HEAD matches expected_sha (fail closed)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::HEAD is ${head_sha}, expected ${EXPECTED_SHA}. Stopping."
            exit 1
          fi
          echo "HEAD verified: ${head_sha}"

      # Written early (not just at the end) so an in-progress run is immediately
      # inspectable from the Summary tab without reading step logs.
      - name: Write initial job summary (repo, refs, checked-out SHA, workflow ref, run link)
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          actual_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          {
            echo "### Sharded remote pr-verification — run #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| source repo | ${SOURCE_REPO} |"
            echo "| source_ref | ${SOURCE_REF} |"
            echo "| expected_sha | ${EXPECTED_SHA} |"
            echo "| actual checked-out SHA | ${actual_sha} |"
            echo "| workflow version/ref | ${WORKFLOW_REF} (gsd-pi-ci) |"
            echo "| shard_count | ${SHARD_COUNT} |"
            echo "| run URL | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute shard matrix from shard_count input
        id: matrix
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          if [[ ! "$SHARD_COUNT" =~ ^[0-9]+$ ]] || [[ "$SHARD_COUNT" -lt 1 ]] || [[ "$SHARD_COUNT" -gt 16 ]]; then
            echo "::error::shard_count must be an integer between 1 and 16, got: $SHARD_COUNT"
            exit 1
          fi
          matrix="$(node -e "console.log(JSON.stringify(Array.from({length: ${SHARD_COUNT}}, (_, i) => i + 1)))")"
          echo "shard_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Shard matrix: ${matrix}"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (pinned, reused from gsd-pi's ci.yml)
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain (native addon for tests)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned, reused from gsd-pi's ci.yml)

      - name: Cache Rust build (native addon)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (pinned, reused from gsd-pi's ci.yml)
        with:
          # Own namespace: must never collide with the stable harness's or gsd-pi's own keys.
          shared-key: gsd-pi-ci-remote-pr-sharded-native-linux-x64-gnu
          workspaces: native -> target

      - name: Build native addon from source (test parity, dev + fault-injection profile)
        env:
          RUSTFLAGS: '-C target-cpu=x86-64'
        run: pnpm run build:native:test

      - name: Build core
        run: pnpm run build:core

      - name: Typecheck extensions
        run: pnpm run typecheck:extensions

      - name: Compile test artifacts
        run: pnpm run test:compile

      - name: Mirror native addon into dist-test (compiled-test loader path)
        run: |
          mkdir -p dist-test/native/addon
          shopt -s nullglob
          addons=(native/addon/*.node)
          if [[ ${#addons[@]} -eq 0 ]]; then
            echo "::error::No compiled .node addon found under native/addon/ - native build did not produce an addon."
            exit 1
          fi
          cp "${addons[@]}" dist-test/native/addon/
          ls -la dist-test/native/addon/

      # Fail-closed, no hardcoded glob list: parses the ACTUAL checked-out commit's own
      # package.json "test:unit:compiled" script for its dist-test/ glob arguments. If a
      # future commit adds/removes/renames a glob in that script, this step picks it up
      # automatically instead of silently drifting from a stale copy (the exact failure
      # mode that made the previous experimental workflow unusable on this branch).
      - name: Derive canonical test globs from the checked-out package.json (no hardcoded copy)
        id: globs
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # single quotes intentionally protect the JS template literals below from shell expansion
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const script = pkg.scripts && pkg.scripts["test:unit:compiled"];
            if (!script) {
              console.error("::error::package.json has no \"test:unit:compiled\" script at this commit - cannot derive a test manifest.");
              process.exit(1);
            }
            const globs = [...script.matchAll(/"(dist-test\/[^"]+)"/g)].map((m) => m[1]);
            if (globs.length === 0) {
              console.error("::error::Found test:unit:compiled but extracted zero dist-test/ glob patterns from it - its format may have changed; update this parser.");
              process.exit(1);
            }
            fs.writeFileSync("test-globs.json", JSON.stringify(globs, null, 2));
            console.log(`Extracted ${globs.length} glob pattern(s) from the checked-out package.json:`);
            for (const g of globs) console.log("  " + g);
          '

      # Deliberately NOT shell globbing (shopt -s nullglob / find / git ls-files): the
      # prior experimental workflow tried multiple approaches for this same tree and
      # got mutually disagreeing, all-incorrect counts, because none of their glob
      # semantics exactly matched each other. Node's own fs.readdirSync + an explicit
      # regex derived from the glob's literal `*` wildcard is unambiguous, and is the
      # same mechanism used to partition the manifest below, so "what got counted" and
      # "what gets partitioned" can never silently disagree with each other.
      - name: Expand globs into a canonical, sorted, de-duplicated test manifest
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # single quotes intentionally protect the JS template literals below from shell expansion
          node -e '
            const fs = require("fs");
            const path = require("path");
            const globs = JSON.parse(fs.readFileSync("test-globs.json", "utf8"));
            const files = new Set();
            for (const pattern of globs) {
              const dir = path.dirname(pattern);
              const base = path.basename(pattern);
              const re = new RegExp("^" + base.split("*").map((s) => s.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*") + "$");
              if (!fs.existsSync(dir)) {
                console.error(`::error::Glob directory does not exist after test:compile: ${dir}`);
                process.exit(1);
              }
              for (const entry of fs.readdirSync(dir)) {
                if (re.test(entry)) files.add(path.join(dir, entry));
              }
            }
            const sorted = [...files].sort();
            if (sorted.length === 0) {
              console.error("::error::Expanded all glob patterns to zero files - test:compile may not have produced output, or the globs no longer match anything.");
              process.exit(1);
            }
            fs.writeFileSync("test-manifest.txt", sorted.join("\n") + "\n");
            console.log(`Canonical manifest: ${sorted.length} compiled test file(s).`);
          '
          total="$(wc -l < test-manifest.txt | tr -d ' ')"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          sha256sum test-manifest.txt > test-manifest.sha256
          cat test-manifest.sha256

      # Deterministic, contiguous chunking of the already-sorted canonical manifest -
      # an explicit partition (allowed as a simpler, more provable alternative to
      # relying on Node's own --test-shard glob-resolution across separate shard
      # processes). Every shard job below runs ONLY its own precomputed chunk; the
      # aggregate job reassembles all chunks and diffs them against the canonical
      # manifest to prove no file was omitted or duplicated.
      - name: Partition canonical manifest into shard_count deterministic chunks
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # single quotes intentionally protect the JS template literals below from shell expansion
          node -e '
            const fs = require("fs");
            const n = parseInt(process.env.SHARD_COUNT, 10);
            const files = fs.readFileSync("test-manifest.txt", "utf8").trim().split("\n").filter(Boolean);
            const total = files.length;
            const base = Math.floor(total / n);
            const extra = total % n;
            let idx = 0;
            for (let i = 0; i < n; i++) {
              const size = base + (i < extra ? 1 : 0);
              const chunk = files.slice(idx, idx + size);
              idx += size;
              fs.writeFileSync(`test-manifest-shard-${i + 1}.txt`, chunk.length ? chunk.join("\n") + "\n" : "");
              console.log(`shard ${i + 1}/${n}: ${chunk.length} file(s)`);
            }
            if (idx !== total) {
              console.error("::error::Partitioning did not consume the entire manifest - internal bug, refusing to proceed.");
              process.exit(1);
            }
          '

      - name: Package build artifact for shard jobs
        shell: bash
        run: |
          tar czf build-output.tar.gz dist-test packages/*/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gsd-pi-sharded-build-output
          path: build-output.tar.gz
          retention-days: 1

      - name: Upload test manifest (canonical + per-shard partitions)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gsd-pi-sharded-test-manifest
          path: |
            test-manifest.txt
            test-manifest.sha256
            test-manifest-shard-*.txt
          retention-days: 3

  test-shard:
    name: test-shard (${{ matrix.shard }}/${{ inputs.shard_count }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build.outputs.shard_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact commit without a token (public repo, read-only)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          repo_url="https://github.com/pimmink/gsd-pi.git"
          target_ref="refs/heads/${SOURCE_REF}"

          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin \
            "+${target_ref}:refs/checkout-ref"
          git checkout --force --detach refs/checkout-ref

      - name: Assert HEAD matches expected_sha (fail closed)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::HEAD is ${head_sha}, expected ${EXPECTED_SHA}. Stopping."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Native addon build/staging and test:compile happen exactly once, in the build
      # job above. Dependency installation is deliberately re-run per shard (cheap and
      # cache-backed, ~12s measured in run 31857969918) rather than trying to package
      # and restore the full node_modules tree as an artifact.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: gsd-pi-sharded-build-output

      - name: Extract build artifact
        run: tar xzf build-output.tar.gz

      - name: Download test manifest
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: gsd-pi-sharded-test-manifest

      - name: Verify manifest checksum before running (defense in depth against artifact corruption)
        shell: bash
        run: sha256sum -c test-manifest.sha256

      # No --test-shard flag: this shard's file list is already an explicit,
      # precomputed, checksummed partition from the build job (see that job's
      # "Partition canonical manifest" step) - every shard demonstrably runs a subset
      # of the exact same manifest, not a re-derived glob resolution of its own.
      - name: Run this shard's precomputed file partition
        id: run_shard
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        shell: bash
        run: |
          set -o pipefail
          shard_file="test-manifest-shard-${{ matrix.shard }}.txt"
          if [[ ! -s "$shard_file" ]]; then
            echo "shard=${{ matrix.shard }} passed=0 failed=0 skipped=0" | tee "shard-${{ matrix.shard }}-summary.txt"
            echo "Shard ${{ matrix.shard }} has an empty partition (shard_count likely exceeds file count) - nothing to run."
            exit 0
          fi
          mapfile -t shard_files < "$shard_file"
          node --import ./scripts/dist-test-resolve.mjs \
            --experimental-test-isolation=process \
            --test-reporter=./scripts/test-reporter-compact.mjs \
            --test "${shard_files[@]}" \
            2>&1 | tee "shard-${{ matrix.shard }}.log"

          summary_line="$(grep -E '^(✔|✖) [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' "shard-${{ matrix.shard }}.log" | tail -1)"
          if [[ -z "$summary_line" ]]; then
            echo "::error::Could not find a compact-reporter summary line in shard ${{ matrix.shard }}'s output."
            exit 1
          fi
          passed="$(echo "$summary_line" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')"
          failed="$(echo "$summary_line" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')"
          skipped="$(echo "$summary_line" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+')"
          echo "shard=${{ matrix.shard }} passed=${passed} failed=${failed} skipped=${skipped}" | tee "shard-${{ matrix.shard }}-summary.txt"

      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: shard-${{ matrix.shard }}-summary
          path: shard-${{ matrix.shard }}-summary.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload shard diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: shard-${{ matrix.shard }}-diagnostics
          path: shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 3

  lifecycle-gate:
    name: lifecycle shadow gate (once, not sharded)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact commit without a token (public repo, read-only)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          repo_url="https://github.com/pimmink/gsd-pi.git"
          target_ref="refs/heads/${SOURCE_REF}"

          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin \
            "+${target_ref}:refs/checkout-ref"
          git checkout --force --detach refs/checkout-ref

      - name: Assert HEAD matches expected_sha (fail closed)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::HEAD is ${head_sha}, expected ${EXPECTED_SHA}. Stopping."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: gsd-pi-sharded-build-output

      - name: Extract build artifact
        run: tar xzf build-output.tar.gz

      - name: Run lifecycle shadow gate
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run gate:lifecycle-shadow-no-cutover 2>&1 | tee "lifecycle-shadow-gate.log"

      - name: Upload lifecycle gate log on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lifecycle-shadow-gate-diagnostics
          path: lifecycle-shadow-gate.log
          if-no-files-found: ignore
          retention-days: 3

  aggregate:
    name: aggregate shard results (fail-closed gate)
    needs: [build, test-shard, lifecycle-gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Fail if any shard job did not succeed
        if: needs.test-shard.result != 'success'
        run: |
          echo "::error::One or more test-shard matrix jobs did not succeed (result: ${{ needs.test-shard.result }}). See per-shard diagnostics artifacts."
          exit 1

      - name: Fail if lifecycle shadow gate did not succeed
        if: needs.lifecycle-gate.result != 'success'
        run: |
          echo "::error::lifecycle-gate job did not succeed (result: ${{ needs.lifecycle-gate.result }})."
          exit 1

      - name: Download test manifest (canonical + per-shard partitions)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: gsd-pi-sharded-test-manifest

      - name: Download all shard summaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: shard-*-summary
          path: summaries
          merge-multiple: true

      # Structural coverage proof, not a magic-number match: reassembles every shard's
      # precomputed partition and diffs the result against the canonical manifest the
      # build job derived from the checked-out package.json. Any gap or duplicate here
      # is a real, unconditional failure regardless of what commit is being verified.
      - name: Prove manifest coverage (no omissions, no duplicates) - not baseline-dependent
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # single quotes intentionally protect the JS template literals below from shell expansion
          node -e '
            const fs = require("fs");
            const n = parseInt(process.env.SHARD_COUNT, 10);
            const canonical = fs.readFileSync("test-manifest.txt", "utf8").trim().split("\n").filter(Boolean);
            let reassembled = [];
            for (let i = 1; i <= n; i++) {
              const p = `test-manifest-shard-${i}.txt`;
              if (!fs.existsSync(p)) {
                console.error(`::error::Missing shard partition file: ${p}`);
                process.exit(1);
              }
              const chunk = fs.readFileSync(p, "utf8").trim().split("\n").filter(Boolean);
              reassembled.push(...chunk);
            }
            const canonicalSorted = [...canonical].sort();
            const reassembledSorted = [...reassembled].sort();
            if (reassembled.length !== new Set(reassembled).size) {
              console.error("::error::A file appears in more than one shard partition - duplicate coverage detected.");
              process.exit(1);
            }
            if (reassembled.length !== canonical.length) {
              console.error(`::error::Reassembled shard partitions (${reassembled.length} files) do not match the canonical manifest (${canonical.length} files) in count.`);
              process.exit(1);
            }
            for (let i = 0; i < canonicalSorted.length; i++) {
              if (canonicalSorted[i] !== reassembledSorted[i]) {
                console.error(`::error::Manifest mismatch at position ${i}: canonical="${canonicalSorted[i]}" reassembled="${reassembledSorted[i]}"`);
                process.exit(1);
              }
            }
            console.log(`Manifest coverage proven: ${canonical.length} canonical files, all assigned to exactly one shard, zero omissions, zero duplicates.`);
          '

      # Dynamic totals only - deliberately NOT compared against any hardcoded
      # historical passed/failed/skipped baseline (the exact dependency that made the
      # prior experimental workflow unusable on a branch with a different test count).
      # `failed` must always be exactly zero; passed/skipped are reported, not gated.
      - name: Sum shard results (dynamic totals, no hardcoded baseline)
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          total_passed=0
          total_failed=0
          total_skipped=0
          shard_files=(summaries/shard-*-summary.txt)
          echo "Found ${#shard_files[@]} shard summary file(s), expected ${SHARD_COUNT}."
          if [[ ${#shard_files[@]} -ne ${SHARD_COUNT} ]]; then
            echo "::error::Expected ${SHARD_COUNT} shard summaries, found ${#shard_files[@]}."
            exit 1
          fi
          for f in "${shard_files[@]}"; do
            cat "$f"
            passed="$(grep -oE 'passed=[0-9]+' "$f" | cut -d= -f2)"
            failed="$(grep -oE 'failed=[0-9]+' "$f" | cut -d= -f2)"
            skipped="$(grep -oE 'skipped=[0-9]+' "$f" | cut -d= -f2)"
            total_passed=$((total_passed + passed))
            total_failed=$((total_failed + failed))
            total_skipped=$((total_skipped + skipped))
          done
          echo "Aggregate: ${total_passed} passed, ${total_failed} failed, ${total_skipped} skipped"
          if [[ "$total_failed" -ne 0 ]]; then
            echo "::error::Aggregate reports ${total_failed} real test failure(s) - hard failure, unconditional regardless of commit."
            exit 1
          fi
          echo "failed=0 confirmed. passed/skipped totals above are this exact commit's real, dynamically-summed counts."

      - name: Write final job summary
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          {
            echo "### Sharded remote pr-verification — final aggregate"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| repo | ${SOURCE_REPO} |"
            echo "| source_ref | ${SOURCE_REF} |"
            echo "| expected_sha | ${EXPECTED_SHA} |"
            echo "| shard_count | ${{ inputs.shard_count }} |"
            echo "| run URL | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"
