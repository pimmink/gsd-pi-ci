name: CI harness self-check

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/run-fixtures.sh