# Minimal macOS runner probe for pimmink/gsd-pi native-attended (W067 / #3162).
# Manual dispatch only. Binds the requested source to an exact SHA, then records
# runner provenance. It runs no test code.
name: macOS native-attended run (gsd-pi)

run-name: "macOS probe: ${{ inputs.source_ref }} @ ${{ inputs.expected_sha }}"

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch in pimmink/gsd-pi (e.g. fix/w067-native-harness-ci-3161)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character commit SHA that source_ref must resolve to'
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: pimmink/gsd-pi

jobs:
  probe:
    name: native-attended (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha is not a full 40-char lowercase SHA"
            exit 1
          fi

      - name: Verify source_ref resolves to expected_sha
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_REF}" | cut -f1)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::$SOURCE_REF resolves to '$actual', expected '$EXPECTED_SHA'"
            exit 1
          fi
          echo "source_ref binding verified: $SOURCE_REF -> $actual"

      - name: Record runner provenance
        shell: bash
        run: |
          set -uo pipefail
          echo "sw_vers:"; sw_vers || true
          echo "uname -m: $(uname -m)"
          echo "runner.os=$RUNNER_OS runner.arch=$RUNNER_ARCH"
          echo "image.os=${ImageOS:-unset} image.version=${ImageVersion:-unset}"
          echo "node: $(node --version 2>/dev/null || echo missing)"
          echo "pnpm: $(pnpm --version 2>/dev/null || echo missing)"

      - name: Check out tested source (exact SHA)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          rm -rf src-under-test
          git init -q src-under-test
          cd src-under-test
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "$EXPECTED_SHA"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::checkout HEAD $actual != expected $EXPECTED_SHA"
            exit 1
          fi
          echo "checkout HEAD verified: $actual"

      - name: Install pnpm and Node
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: src-under-test
        run: pnpm install --frozen-lockfile

      - name: Build native package (dependency-first, before tests)
        working-directory: src-under-test
        shell: bash
        run: |
          set -euo pipefail
          # The attended tests import @gsd/native from dist/. Build it explicitly
          # in the tested checkout; an unbuilt checkout fails with ERR_MODULE_NOT_FOUND.
          pnpm run build:native-pkg
          test -f packages/native/dist/directory-sync/index.js

      - name: Build native fixture package
        id: fixture
        working-directory: src-under-test
        shell: bash
        run: |
          set -euo pipefail
          fixture_package="$(node scripts/build-native-fixture-package.mjs)"
          if [ ! -d "$fixture_package" ]; then
            echo "::error::fixture package not created: $fixture_package"
            exit 1
          fi
          echo "W067_NATIVE_FIXTURE_PACKAGE=$fixture_package" >> "$GITHUB_ENV"

      - name: Diagnose @gsd/native resolution before tests
        working-directory: src-under-test
        shell: bash
        run: |
          set -uo pipefail
          echo "--- link:"; ls -l node_modules/@gsd/native 2>&1 || echo "(no link)"
          echo "--- link target:"; readlink -f node_modules/@gsd/native 2>&1 || true
          echo "--- dist present:"; ls packages/native/dist/directory-sync/index.js 2>&1 || true
          echo "--- import from checkout:"
          node --input-type=module -e 'try{await import("@gsd/native/directory-sync");console.log("OK")}catch(e){console.log("FAIL",e.code)}' 2>&1 || true

      - name: Run native attended fixtures
        working-directory: src-under-test
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # `|| rc=$?` keeps the inherited -e from exiting before the log tail and
          # the explicit failure below. The real exit code is preserved.
          node --import tsx --test --test-concurrency=1 src/tests/coordination-maintenance-attended.test.ts > native-attended.tap.log 2>&1 || rc=$?
          tail -25 native-attended.tap.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::native attended fixtures failed (exit $rc)"
            exit "$rc"
          fi
